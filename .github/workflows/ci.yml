name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare local environment
        run: cp .env.example .env

      - name: Build PHP runtime
        run: ./bin/dev build app

      - name: Install locked dependencies
        run: ./bin/dev run --rm -T app composer install --no-interaction --prefer-dist

      - name: Configure application and seed development database
        run: |
          ./bin/dev run --rm -T app php artisan key:generate --no-interaction
          ./bin/dev run --rm -T app php artisan jwt:secret --force --no-interaction > /dev/null
          ./bin/dev run --rm -T app php artisan migrate --seed --no-interaction
          ./bin/dev up -d --wait

      - name: Check Composer manifest and platform
        run: |
          ./bin/dev exec -T app composer validate --strict
          ./bin/dev exec -T app composer check-platform-reqs

      - name: Lint, analyse and test
        run: ./bin/dev exec -T app composer check --no-interaction

      - name: Verify HTTP and Redis connection
        run: |
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://localhost:8000/api/ping
          ./bin/dev exec -T app php artisan tinker --execute="if ((string) Illuminate\Support\Facades\Redis::connection()->ping() !== 'PONG') { throw new RuntimeException('Redis ping failed.'); }"

      - name: Service logs on failure
        if: failure()
        run: ./bin/dev logs --no-color --tail=80

      - name: Stop CI environment
        if: always()
        run: ./bin/dev down --volumes --remove-orphans
